[project]
name = "munin"
version = "0.1.0"
description = "An issue tracker for you and your agents, over MCP"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143",
    "mcp>=2.3",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
munin = "munin:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
